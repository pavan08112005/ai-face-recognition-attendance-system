
services:
  - type: web
    name: face-attendance-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ATTENDANCE_ADMIN_PASSWORD
        sync: false
